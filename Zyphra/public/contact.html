<!DOCTYPE html>

<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Contact | Zyphra Digital</title>

    <link rel="stylesheet"
    <link rel="stylesheet" href="../css/style.css">

</head>

<body>

<header class="header">

    <a href="../index.html" class="logo">

        <img src="../assets/logo.png"
             alt="Zyphra Digital">

    </a>

    <button class="menu-btn"
            id="menuBtn">

        ☰

    </button>

    <nav id="nav">

        <a href="../index.html">
            Index
        </a>

        <a href="../pages/about.html">
            About
        </a>

        <a href="../pages/services.html">
            Services
        </a>

        <a href="../pages/contact.html"
           class="contact-btn">

            Contact

        </a>

    </nav>

</header>


<section class="section">

    <span class="tag">
        ZYPHRA DIGITAL / CONTACT
    </span>

    <h1>

        Vamos fazer sua marca
        <span>acontecer.</span>

    </h1>

    <p class="text">

        Conte para nós sobre seu projeto.
        Vamos entender seu desafio e encontrar
        a melhor estratégia.

    </p>

</section>


<section class="section">

<form id="contactForm">

    <label>
        Nome
    </label>

    <input
        type="text"
        name="name"
        placeholder="Seu nome"
        required
    >


    <label>
        E-mail
    </label>

    <input
        type="email"
        name="email"
        placeholder="voce@empresa.com"
        required
    >


    <label>
        Empresa
    </label>

    <input
        type="text"
        name="company"
        placeholder="Nome da empresa"
    >


    <label>
        Serviço
    </label>

    <select name="service">

        <option value="">
            Selecione
        </option>

        <option>
            Estratégia
        </option>

        <option>
            Branding
        </option>

        <option>
            Social Media
        </option>

        <option>
            Website
        </option>

        <option>
            Performance
        </option>

    </select>


    <label>
        Mensagem
    </label>

    <textarea
        name="message"
        rows="7"
        placeholder="Conte sobre seu projeto..."
        required
    ></textarea>


    <button
        type="submit"
        class="btn-primary">

        Enviar mensagem →

    </button>


    <p id="formMessage"></p>

</form>

</section>


<footer>

    <img src="../assets/logo.png"
         alt="Zyphra Digital">

    <p>
        © 2026 Zyphra Digital
    </p>

</footer>


<script src="../../js/main.js"></script>

</body>

</html>
